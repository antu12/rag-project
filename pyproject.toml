[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-cli"
version = "0.1.0"
description = "A command-line RAG learning project with OpenAI, Gemini, pgvector, and Qdrant."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "google-genai>=1.0.0",
  "inngest>=0.4.0",
  "openai>=1.40.0",
  "psycopg[binary]>=3.2.0",
  "pydantic>=2.8.0",
  "pypdf>=4.3.0",
  "pyyaml>=6.0.0",
  "qdrant-client>=1.10.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2.0",
]

[project.scripts]
rag = "rag_cli.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
